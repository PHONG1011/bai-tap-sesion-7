<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Layout</title>
  <link rel="stylesheet" href="style.css">
  <style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f0f0f0;
  }
  
  .container {
    display: flex;
    gap: 20px;
  }
  
  .left-column {
    flex: 2;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  
  .right-column {
    flex: 3;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  
  .row {
    display: flex;
    gap: 10px;
  }
  
  .big-box {
    background-color: #1e1e1e;
    color: white;
    height: 125px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
  }
  
  .small-box {
    background-color: #1e1e1e;
    color: white;
    flex: 1;
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-column">
      <div class="big-box">Big</div>
      <div class="big-box">Big</div>
    </div>
    <div class="right-column">
      <div class="row">
        <div class="small-box">Small 1</div>
        <div class="small-box">Small 2</div>
      </div>
      <div class="row">
        <div class="small-box">Small 3</div>
        <div class="small-box">Small 4</div>
      </div>
      <div class="row">
        <div class="small-box">Small 5</div>
        <div class="small-box">Small 6</div>
      </div>
      <div class="row">
        <div class="small-box">Small 7</div>
        <div class="small-box">Small 8</div>
      </div>
    </div>
  </div>
</body>
</html>
